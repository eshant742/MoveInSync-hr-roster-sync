# ──────────────────────────────────────────────
# HR Roster Sync — Application Configuration
# ──────────────────────────────────────────────

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: hr-roster-sync

  # ── DataSource ────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/roster_sync
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # ── JPA / Hibernate ───────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ───────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Actuator / Monitoring ─────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ── Logging ───────────────────────────────────
logging:
  level:
    root: INFO
    com.moveinsync: INFO
    org.springframework.security: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","logger":"%logger{36}","thread":"%thread","message":"%msg"}%n'

# ── Custom Application Properties ────────────
roster:
  safety-brake:
    threshold: ${SAFETY_BRAKE_THRESHOLD:0.30}
  reconciliation:
    batch-size: ${RECONCILIATION_BATCH_SIZE:1000}
