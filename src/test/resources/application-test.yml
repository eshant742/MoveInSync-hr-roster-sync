# ──────────────────────────────────────────────
# HR Roster Sync — Test Profile Configuration
# ──────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:h2:mem:roster_sync_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  security:
    user:
      name: test
      password: test

# ── Custom Application Properties ────────────
roster:
  safety-brake:
    threshold: 0.30
  reconciliation:
    batch-size: 100
